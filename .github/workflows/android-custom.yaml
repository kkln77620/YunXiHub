name: "android-custom"

on:
  workflow_dispatch:

jobs:
  build-android:
    name: "Build custom APK (YunXiHub remote resolver)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash

      # ---- YunXiHub 固定签名 ----
      # keystore 已入库（android/app/yunxihub-release.keystore + android/key.properties），
      # 所有构建使用同一签名，覆盖安装不再提示签名不一致。

      - name: Build APK
        run: flutter build apk --release --dart-define=DANDANAPI_APPID=${{ secrets.DANDANAPI_APPID }} --dart-define=DANDANAPI_KEY=${{ secrets.DANDANAPI_KEY }}
        shell: bash

      - name: Print APK signature (for CI verification)
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk 2>/dev/null | grep -E 'Owner|SHA256|Signer|Valid' | head -8
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-custom-apk
          path: build/app/outputs/flutter-apk/app-release.apk
