name: "android-custom"

on:
  workflow_dispatch:

jobs:
  build-android:
    name: "Build custom APK (YunXiHub remote resolver)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash

      # ---- YunXiHub 固定签名 ----
      # 第一次构建（Secret 未配置）自动生成 keystore 并上传 artifact，
      # 下载后 base64 存入 ANDROID_KEYSTORE_BASE64，之后所有构建复用同一签名。
      - name: Prepare signing from secret
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/yunxihub-release.keystore
          cat > android/key.properties <<EOF
          storeFile=../app/yunxihub-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Seed keystore (first run)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore android/app/yunxihub-release.keystore \
            -alias yunxihub -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass YunxiKey@2026 -keypass YunxiKey@2026 \
            -dname "CN=YunXiHub, OU=YunXi, O=YunXi, L=Beijing, ST=Beijing, C=CN"
          cat > android/key.properties <<EOF
          storeFile=../app/yunxihub-release.keystore
          storePassword=YunxiKey@2026
          keyAlias=yunxihub
          keyPassword=YunxiKey@2026
          EOF

      - name: Upload keystore seed (first run only)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: yunxihub-keystore-seed
          path: |
            android/app/yunxihub-release.keystore
            android/key.properties

      - name: Build APK
        run: flutter build apk --release --dart-define=DANDANAPI_APPID=${{ secrets.DANDANAPI_APPID }} --dart-define=DANDANAPI_KEY=${{ secrets.DANDANAPI_KEY }}
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-custom-apk
          path: build/app/outputs/flutter-apk/app-release.apk
